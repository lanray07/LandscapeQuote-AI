name: iOS Xcode Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app without signing
        run: |
          set +e
          xcodebuild -project LandscapeQuoteAI.xcodeproj \
            -scheme LandscapeQuoteAI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build > xcodebuild.log 2>&1
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "Xcode build failed. Relevant diagnostics:"
            grep -nE "error:|warning:|BUILD FAILED|The following build commands failed" xcodebuild.log || tail -n 120 xcodebuild.log
          fi

          exit "$status"
